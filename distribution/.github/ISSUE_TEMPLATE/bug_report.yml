name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a **pagination or layout** problem, attaching the HTML file
        is the single most useful thing you can do — the issue almost always
        lives in the document.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PageTML version
      description: PageTML ▸ About PageTML
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "14.5 (Sonoma), M2"
    validations:
      required: true

  - type: textarea
    id: document
    attributes:
      label: The document
      description: >
        Drag the .html file in here (zip it if GitHub rejects the extension).
        If you can't share it, describe what it contains — a Google Docs export,
        a Markdown render, an app-style page, tall images, tables?

  - type: checkboxes
    id: remote
    attributes:
      label: Settings
      options:
        - label: The **Remote** toggle was on for this document
        - label: It happened in presentation mode
