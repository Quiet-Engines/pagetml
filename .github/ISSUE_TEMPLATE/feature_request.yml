name: Feature request
description: Suggest something PageTML should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Known and not planned for now — no need to file these: everything listed
        under [Not supported](https://github.com/Quiet-Engines/pagetml#not-supported)
        in the README.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe the situation rather than the feature — what you're presenting
        or reading, and where PageTML gets in the way.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your proposed solution, if you have one in mind.
