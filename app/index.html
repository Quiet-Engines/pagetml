<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pager</title>
    <link rel="icon" type="image/svg+xml" href="/brand/mark.svg" />
    <style>
      /* Identity: dark theater, lit stage (spec §5). Chrome recedes; the paper
         page is the stage; a single spotlight-amber accent carries interaction. */
      :root {
        --house: #171b24;        /* app chrome (the darkened house) */
        --house-2: #1e2532;      /* raised chrome surfaces */
        --ink: #e7e9ee;          /* chrome text */
        --ink-dim: #9aa3b2;      /* secondary chrome text */
        --amber: #f5a623;        /* the spotlight accent */
        --amber-soft: rgba(245, 166, 35, 0.14);
        --paper: #fdfcf7;        /* the stage: warm paper white */
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--house);
        color: var(--ink);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      #app { height: 100vh; }

      /* --- start screen --- */
      .start {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 32px;
      }
      /* Typeface logo (public/brand/): inline SVG strokes inherit chrome ink
         via currentColor; the period is the lone amber element. */
      .wordmark svg { display: block; height: 58px; margin: 0 auto; }
      .wordmark .dot,
      .back .dot { fill: var(--amber); }
      .tagline { color: var(--ink-dim); margin-top: 10px; }
      .dropzone {
        width: min(560px, 90%);
        border: 1.5px dashed #38404f;
        border-radius: 12px;
        padding: 26px;
        text-align: center;
        color: var(--ink-dim);
        background: var(--house-2);
      }
      .dropzone strong { color: var(--ink); }
      .recents { width: min(560px, 90%); }
      .recents h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--ink-dim);
        margin: 0 0 10px;
      }
      .recent-list { display: flex; flex-direction: column; gap: 6px; }
      .recent {
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        background: var(--house-2);
        color: var(--ink);
        border: 1px solid #2a3242;
        border-radius: 8px;
        padding: 10px 12px;
        cursor: pointer;
        font: inherit;
      }
      .recent:hover { border-color: var(--amber); }
      .recent .glyph { color: var(--amber); }
      .recent .name { flex: 1; }
      .recent .meta { color: var(--ink-dim); font-size: 12px; }

      /* --- reading mode --- */
      .reading { height: 100%; display: flex; flex-direction: column; }
      .stage {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
      }
      .paper {
        width: min(820px, 92%);
        height: 92%;
        background: var(--paper);
        border: 0;
        border-radius: 3px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
      }
      .chevron {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 12%;
        border: 0;
        background: transparent;
        color: transparent;
        font-size: 28px;
        cursor: pointer;
        transition: color 0.15s, background 0.15s;
      }
      .stage:hover .chevron { color: rgba(245, 166, 35, 0.55); }
      .chevron:hover { color: var(--amber); background: linear-gradient(90deg, var(--amber-soft), transparent); }
      .chevron.right { right: 0; background: linear-gradient(270deg, var(--amber-soft), transparent); }
      .chevron.left { left: 0; }
      .chevron:disabled { color: transparent !important; cursor: default; background: transparent; }

      .statusbar {
        height: 42px;
        flex: 0 0 42px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 16px;
        background: var(--house-2);
        border-top: 1px solid #262d3b;
        font-size: 13px;
      }
      .statusbar .back {
        background: transparent;
        border: 0;
        padding: 0;
        color: var(--ink);
        cursor: pointer;
        display: flex;
        align-items: center;
      }
      .statusbar .back svg { display: block; height: 19px; }
      .statusbar .back:hover { color: #fff; }
      .counter {
        color: var(--amber);
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .chip {
        color: var(--ink-dim);
        border: 1px solid #313a4b;
        border-radius: 999px;
        padding: 2px 9px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .hint { color: var(--ink-dim); margin-left: auto; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/chrome/chrome.ts"></script>
  </body>
</html>
