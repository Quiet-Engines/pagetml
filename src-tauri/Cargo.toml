[package]
name = "pagetml"
version = "1.0.0"
description = "PageTML — a paginated HTML reader"
authors = ["Quiet Engines"]
edition = "2021"
rust-version = "1.77"

# The library the desktop binary and (later) mobile targets share.
[lib]
name = "pagetml_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native "Open…" dialog (Tauri v2 plugin).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[features]
# Enable the custom (pagetml://) protocol in release builds.
custom-protocol = ["tauri/custom-protocol"]
